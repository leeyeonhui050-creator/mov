<section class="process section-pad" id="process">

      <span>01</span>
      <h3>STYLE INTERVIEW</h3>
      <p>내가 어떤 사람인지, 무엇을 좋아하고 어떤 모습으로 보이고 싶은지 이야기합니다. 스타일을 이해하기 위한 대화입니다.</p>

    <article class="process__step">
      <span>02</span>
      <h3>STYLE ANALYSIS</h3>

    </article>
    <article class="process__step">
      <span>03</span>
      <h3>STYLE GUIDE</h3>

    </article>
    <article class="process__step">
      <span>04</span>
      <h3>PERSONAL STYLING</h3>

    </article>
